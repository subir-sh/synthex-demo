<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17292d">
  <title>Synthex Demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f4eee3; background: #17292d; }
    * { box-sizing: border-box; }
    html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; background: #17292d; }
    #unity-canvas:fullscreen { width: 100vw; height: 100vh; }
    #entry { position: absolute; inset: 0; display: grid; place-items: center; background: #17292d; z-index: 2; }
    #entry[hidden] { display: none; }
    .welcome { width: min(360px, calc(100vw - 48px)); text-align: center; }
    h1 { font-family: Georgia, serif; font-size: clamp(34px, 5vw, 52px); letter-spacing: .16em; font-weight: normal; margin: 0 0 20px; }
    p { margin: 12px 0; line-height: 1.7; color: #bac9c7; }
    progress { width: 100%; height: 5px; accent-color: #78bcb4; }
    button { font: inherit; cursor: pointer; border: 1px solid #718c8c; border-radius: 6px; padding: 12px 24px; color: #f4eee3; background: #244b4d; }
    button:hover { background: #306063; }
    button:focus-visible { outline: 2px solid #f4eee3; outline-offset: 4px; }
    #start { margin-top: 16px; width: 100%; }
    #windowed { display: block; border: 0; background: transparent; color: #bac9c7; margin: 6px auto 0; padding: 8px; }
    #fullscreen { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 1; padding: 8px 12px; font-size: 13px; opacity: .8; }
    #fullscreen[hidden] { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="Synthex 게임"></canvas>
    <button id="fullscreen" type="button" hidden>전체화면</button>
    <section id="entry" aria-label="게임 불러오기">
      <div class="welcome">
        <h1>SYNTHEX</h1>
        <p id="status" role="status" aria-live="polite">게임을 불러오는 중입니다.</p>
        <progress id="progress" max="1" value="0" aria-label="불러오기 진행"></progress>
        <button id="start" type="button" hidden>전체화면으로 플레이</button>
        <button id="windowed" type="button" hidden>창에서 플레이</button>
      </div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const entry = document.getElementById("entry");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    const start = document.getElementById("start");
    const windowed = document.getElementById("windowed");
    const fullscreen = document.getElementById("fullscreen");
    let player;
    function enterFullscreen() {
      if (!player) return;
      try { player.SetFullscreen(1); } catch (error) { console.warn(error); }
    }
    function play(fullscreenRequested) {
      entry.hidden = true;
      fullscreen.hidden = false;
      canvas.focus();
      if (fullscreenRequested) enterFullscreen();
    }
    start.addEventListener("click", () => play(true));
    windowed.addEventListener("click", () => play(false));
    fullscreen.addEventListener("click", enterFullscreen);
    const buildUrl = "Build";
    const dataParts = /* SYNTHEX_DATA_PARTS */ [{"bytes":33554432,"name":"WebGL.data.unityweb.part00"},{"bytes":33554432,"name":"WebGL.data.unityweb.part01"},{"bytes":33554432,"name":"WebGL.data.unityweb.part02"},{"bytes":30197340,"name":"WebGL.data.unityweb.part03"}];
    const config = {
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Synthex",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    const loader = document.createElement("script");
    loader.src = buildUrl + "/WebGL.loader.js";
    function failed(error) {
      console.error(error);
      progress.hidden = true;
      status.textContent = "게임을 불러오지 못했습니다. 페이지를 새로고침해 주세요.";
    }
    loader.onerror = failed;
    async function prepareData() {
      if (!dataParts) return null;
      const buffers = [];
      const total = dataParts.reduce((sum, part) => sum + part.bytes, 0);
      let downloaded = 0;
      for (const part of dataParts) {
        const response = await fetch(buildUrl + "/" + part.name);
        if (!response.ok) throw new Error("Data download failed: " + response.status);
        const reader = response.body.getReader();
        let partBytes = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffers.push(value);
          partBytes += value.byteLength;
          downloaded += value.byteLength;
          progress.value = 0.65 * downloaded / total;
        }
        if (partBytes !== part.bytes) throw new Error("Incomplete game data: " + part.name);
      }
      const url = URL.createObjectURL(new Blob(buffers, { type: "application/octet-stream" }));
      config.dataUrl = url;
      config.cacheControl = file => file === url ? "no-store" : "must-revalidate";
      return url;
    }
    loader.onload = async () => {
      let dataObjectUrl;
      try {
        dataObjectUrl = await prepareData();
        const instance = await createUnityInstance(canvas, config, value => {
          progress.value = dataParts ? 0.65 + 0.35 * value : value;
        });
        player = instance;
        progress.hidden = true;
        status.textContent = "원소를 조합해 마법을 펼쳐보세요.";
        start.hidden = false;
        windowed.hidden = false;
      } catch (error) { failed(error); }
      finally { if (dataObjectUrl) URL.revokeObjectURL(dataObjectUrl); }
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
